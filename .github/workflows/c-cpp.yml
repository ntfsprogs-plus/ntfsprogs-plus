name: ntfsprogs-plus test CI

on:
  push:
    branches:
      - main
      - ntfs-next
  pull_request:
    branches:
      - main
      - ntfs-next

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: install packages
      run: |
        sudo apt-get install libgcrypt20-dev
        sudo apt-get remove libntfs-3g89
    - name: build ntfsprogs
      run: |
        ./autogen.sh
        ./configure
        make
        sudo make install
    - name: check fsck repairs
      run: python3 tests/test_fsck_repairs.py --build-dir .
    - name: check journal recovery
      run: python3 tests/test_fsck_journal.py --build-dir .
    - name: check volume flags
      run: |
        cc -O2 -Wall -Wextra -Werror -o tests/test_volume_flags tests/test_volume_flags.c
        tests/test_volume_flags --build-dir . --temp-dir "$RUNNER_TEMP"
    - name: check security descriptor layouts
      run: python3 tests/test_secure_descriptors.py --build-dir .
    - name: check external image runner
      run: python3 tests/test_image_runner.py
    - name: check ntfs test images
      run: |
        cd tests
        ./test_all_images.sh
    - name: check failure exit status
      run: |
        cc -O2 -Wall -Wextra -Werror -o tests/test_failure_status tests/test_failure_status.c
        cc -O2 -Wall -Wextra -Werror -shared -fPIC -DFAILURE_STATUS_SHIM -o tests/failure_status_shim.so tests/test_failure_status.c -ldl
        tests/test_failure_status --build-dir . --shim tests/failure_status_shim.so --temp-dir "$RUNNER_TEMP" --corpus tests/ntfs_corrupted_images/created_manually
